<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>河谷素材册 · 梦想小镇</title>
<style>
:root{font-family:'PingFang SC',system-ui,sans-serif;color:#eae6d7;background:#172920}*{box-sizing:border-box}body{margin:0}header{padding:52px max(24px,5vw) 28px;border-bottom:1px solid #c9d7b326;background:radial-gradient(ellipse at top right,#526c41,transparent 65%)}.eyebrow{letter-spacing:4px;font-size:11px;color:#c5ceab}h1{font:48px 'Songti SC',Georgia,serif;font-weight:400;margin:14px 0}header p{color:#b9c9b6;max-width:760px;line-height:1.9;font-size:14px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;font-size:12px;color:#b5c5b1}.stats b{font:28px Georgia,serif;color:#efd392;margin-right:8px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:22px max(24px,5vw);position:sticky;top:0;background:#172920ee;backdrop-filter:blur(15px);z-index:2}button{font:inherit;border:1px solid #c4d4b53b;color:inherit;background:transparent;padding:9px 14px;border-radius:22px;cursor:pointer;font-size:12px}button:hover,button[aria-pressed=true]{background:#d9dfc6;color:#233b2d}button:focus-visible{outline:3px solid #e9c883;outline-offset:3px}main{padding:0 max(24px,5vw) 60px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}article{border:1px solid #a6b68f32;border-radius:16px;overflow:hidden;background:#20372b}article header{padding:20px;background:none;display:flex;align-items:center;justify-content:space-between;gap:10px}article h2{font-size:19px;font-weight:500;margin:0 0 8px}article small{font-size:11px;color:#aaba9f}.stage{padding:20px;background-color:#2b4233;background-image:linear-gradient(45deg,#ffffff04 25%,transparent 25%,transparent 75%,#ffffff04 75%),linear-gradient(45deg,#ffffff04 25%,transparent 25%,transparent 75%,#ffffff04 75%);background-size:32px 32px;background-position:0 0,16px 16px}.stage>img{width:100%;display:block;object-fit:contain;max-height:580px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{min-width:0;text-align:center;padding:5px;border:1px solid #ffffff14;border-radius:8px;background:#10271b36}.tile canvas{width:100%;height:104px;object-fit:contain}.tile span{display:block;font-size:9px;color:#c1ceb9;overflow-wrap:anywhere;margin:6px 0}.note{padding:14px 20px;color:#b7c6ae;font-size:11px;line-height:1.7}footer{padding:10px 5vw 40px;color:#a9baa1;font-size:12px}a{color:#e4cf93}@media(max-width:720px){main{grid-template-columns:1fr}h1{font-size:36px}header{padding-top:32px}.frames{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><div class="eyebrow">DREAM TOWN / ART COLLECTION 02</div><h1>河谷素材册</h1><p>让小镇的日常，看得见。搬运与劳作、满载归来的商队、新邻居的笑脸，还有会随生活成长的房子。</p><div class="stats" id="stats"></div></header>
<nav aria-label="素材筛选"><button data-filter="all" aria-pressed="true">全部图集</button><button data-filter="people">居民与宠物</button><button data-filter="town">建筑与装饰</button><button data-filter="motion">动作与图层</button><button id="motion" aria-pressed="false">播放动作示意</button></nav><main id="gallery"></main><footer>此页用于素材检查，尚未接入游戏行为。透明边缘、逐帧动作和机械挂接位置可在切片模式检查。<a href="/assets/expansion-assets.json">查看帧坐标与验收数据</a></footer>
<script type="module">
const manifest=await fetch('/assets/expansion-assets.json').then(r=>{if(!r.ok)throw Error('素材目录加载失败');return r.json()});
const labels={people:['citizens-actions','story-portraits','pets'],town:['street-decor','season-props','industry2','housing-levels'],motion:['disasters','citizens-actions','caravan','machine-layers','pets']};
document.querySelector('#stats').innerHTML=`<span><b>${manifest.atlases.length}</b>图集</span><span><b>${manifest.activeFrames}</b>有效画格</span><span><b>${(manifest.webpBytes/1e6).toFixed(2)}</b>MB WebP</span><span>全部采用真实 Alpha 透明背景</span>`;
let moving=false;const previews=[];
// Decoding is deferred by the browser in a hidden tab, so it must never gate the
// gallery. Build the cards first, and let each image finish on its own with a
// timeout so a suspended decode cannot stall the page.
const whenDecoded=(img,src)=>{const loaded=new Promise(resolve=>{if(img.complete&&img.naturalWidth)return resolve();img.addEventListener('load',()=>resolve(),{once:true});img.addEventListener('error',()=>resolve(),{once:true});setTimeout(resolve,8000);});img.src=src;return loaded.then(()=>Promise.race([img.decode().catch(()=>{}),new Promise(r=>setTimeout(r,3000))]));};
for(const atlas of manifest.atlases){const card=document.createElement('article');card.dataset.name=atlas.name;card.innerHTML=`<header><div><h2>${atlas.label}</h2><small>${atlas.width} × ${atlas.height} · ${atlas.activeFrames} 画格 · ${(atlas.webpBytes/1024).toFixed(0)} KB</small></div><button aria-pressed="false">查看切片</button></header><div class="stage"><img alt="${atlas.label}完整图集" src="${atlas.image}" loading="lazy"></div><div class="note">${atlas.name} · 透明像素 ${atlas.alphaPercent}%${atlas.name==='housing-levels'||atlas.name==='machine-layers'?' · 4 × 2 排列，末尾两格备用':''}</div>`;
 document.querySelector('#gallery').append(card);
 const image=new Image();const ready=whenDecoded(image,atlas.image);const stage=card.querySelector('.stage');let split=false;
 const frames=Object.entries(atlas.frames);const draw=(canvas,frame,withPivot=false)=>{const ctx=canvas.getContext('2d');canvas.width=192;canvas.height=160;ctx.clearRect(0,0,192,160);const scale=Math.min(180/frame.w,145/frame.h),w=frame.w*scale,h=frame.h*scale,x=(192-w)/2,y=(160-h)/2;ctx.drawImage(image,frame.x,frame.y,frame.w,frame.h,x,y,w,h);if(withPivot){const px=x+frame.pivot[0]*scale,py=y+frame.pivot[1]*scale;ctx.strokeStyle='#f0b852';ctx.beginPath();ctx.moveTo(px-5,py);ctx.lineTo(px+5,py);ctx.moveTo(px,py-5);ctx.lineTo(px,py+5);ctx.stroke();}};
 card.querySelector('button').onclick=async e=>{const button=e.currentTarget;await ready;split=!split;button.setAttribute('aria-pressed',String(split));button.textContent=split?'查看整图':'查看切片';stage.replaceChildren();if(!split){const img=image.cloneNode();img.alt=atlas.label+'完整图集';stage.append(img);return;}const grid=document.createElement('div');grid.className='frames';for(let i=0;i<frames.length;i++){const [id,frame]=frames[i],tile=document.createElement('div');tile.className='tile';const canvas=document.createElement('canvas'),caption=document.createElement('span');canvas.setAttribute('aria-label',id);caption.textContent=id;tile.append(canvas,caption);grid.append(tile);draw(canvas,frame,atlas.name==='machine-layers');if(labels.motion.includes(atlas.name)&&atlas.name!=='machine-layers'&&i%2===0)previews.push({card,canvas,frames:[frame,frames[i+1]?.[1]??frame],draw});}stage.append(grid);};
}
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{const filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('article').forEach(card=>card.hidden=filter!=='all'&&!labels[filter].includes(card.dataset.name));});
document.querySelector('#motion').onclick=e=>{moving=!moving;e.currentTarget.setAttribute('aria-pressed',String(moving));e.currentTarget.textContent=moving?'暂停动作示意':'播放动作示意';if(moving)document.querySelectorAll('article').forEach(card=>{if(labels.motion.includes(card.dataset.name)&&card.querySelector('button').getAttribute('aria-pressed')==='false')card.querySelector('button').click();});};
let step=0;setInterval(()=>{if(!moving||document.hidden)return;step=1-step;for(let i=previews.length-1;i>=0;i--){const p=previews[i];if(!p.canvas.isConnected){previews.splice(i,1);continue;}if(!p.card.hidden)p.draw(p.canvas,p.frames[step]);}},500);
</script></html>
