<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>河谷素材册 · 梦想小镇</title>
<style>
:root{font-family:'PingFang SC',system-ui,sans-serif;color:#eae6d7;background:#172920}*{box-sizing:border-box}body{margin:0}header{padding:52px max(24px,5vw) 28px;border-bottom:1px solid #c9d7b326;background:radial-gradient(ellipse at top right,#526c41,transparent 65%)}.eyebrow{letter-spacing:4px;font-size:11px;color:#c5ceab}h1{font:48px 'Songti SC',Georgia,serif;font-weight:400;margin:14px 0}header p{color:#b9c9b6;max-width:760px;line-height:1.9;font-size:14px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;font-size:12px;color:#b5c5b1}.stats b{font:28px Georgia,serif;color:#efd392;margin-right:8px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:22px max(24px,5vw);position:sticky;top:0;background:#172920ee;backdrop-filter:blur(15px);z-index:2}button{font:inherit;border:1px solid #c4d4b53b;color:inherit;background:transparent;padding:9px 14px;border-radius:22px;cursor:pointer;font-size:12px}button:hover,button[aria-pressed=true]{background:#d9dfc6;color:#233b2d}button:focus-visible{outline:3px solid #e9c883;outline-offset:3px}main{padding:0 max(24px,5vw) 60px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}article{border:1px solid #a6b68f32;border-radius:16px;overflow:hidden;background:#20372b}article header{padding:20px;background:none;display:flex;align-items:center;justify-content:space-between;gap:10px}article h2{font-size:19px;font-weight:500;margin:0 0 8px}article small{font-size:11px;color:#aaba9f}.stage{padding:20px;background-color:#2b4233;background-image:linear-gradient(45deg,#ffffff04 25%,transparent 25%,transparent 75%,#ffffff04 75%),linear-gradient(45deg,#ffffff04 25%,transparent 25%,transparent 75%,#ffffff04 75%);background-size:32px 32px;background-position:0 0,16px 16px}.stage>img{width:100%;display:block;object-fit:contain;max-height:580px}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{min-width:0;text-align:center;padding:5px;border:1px solid #ffffff14;border-radius:8px;background:#10271b36}.tile canvas{width:100%;height:104px;object-fit:contain}.tile span{display:block;font-size:9px;color:#c1ceb9;overflow-wrap:anywhere;margin:6px 0}.note{padding:14px 20px;color:#b7c6ae;font-size:11px;line-height:1.7}footer{padding:10px 5vw 40px;color:#a9baa1;font-size:12px}a{color:#e4cf93}@media(max-width:720px){main{grid-template-columns:1fr}h1{font-size:36px}header{padding-top:32px}.frames{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><div class="eyebrow">DREAM TOWN / ART COLLECTION 02</div><h1>河谷素材册</h1><p>让小镇的日常，看得见。搬运与劳作、满载归来的商队、新邻居的笑脸，还有会随生活成长的房子。</p><div class="stats" id="stats"></div></header>
<nav aria-label="素材筛选"><button data-filter="all" aria-pressed="true">全部图集</button><button data-filter="people">居民与宠物</button><button data-filter="town">建筑与装饰</button><button data-filter="motion">动作与图层</button><button id="motion" aria-pressed="false">播放动作示意</button></nav><main id="gallery"></main><footer>此页用于素材检查，扩展玩法尚未接入。补充素材首次在线查看后才可离线复看。透明边缘、逐帧动作和机械挂接位置可在切片模式检查。<a href="/assets/expansion-assets.json">查看帧坐标与验收数据</a></footer>
<script type="module">
const manifest=await fetch('/assets/expansion-assets.json').then(r=>{if(!r.ok)throw Error('素材目录加载失败');return r.json()});
const additions=await fetch('/assets/expansion-2026-09/manifest.json').then(r=>{if(!r.ok)throw Error('新增素材目录加载失败');return r.json()});
const accessories=await fetch('/assets/accessories-2026-09/manifest.json').then(r=>{if(!r.ok)throw Error('配件目录加载失败');return r.json()});
const readiness=await fetch('/assets/readiness-2026-09/manifest.json').then(r=>r.json());
manifest.atlases.push(...readiness.atlases);manifest.activeFrames+=readiness.activeFrames;manifest.webpBytes+=readiness.webpBytes;
manifest.atlases.push(...additions.atlases,...accessories.atlases);manifest.activeFrames+=additions.activeFrames+accessories.activeFrames;manifest.webpBytes+=additions.webpBytes+accessories.webpBytes;
const labels={people:['citizens-actions','story-portraits','pets'],town:['street-decor','season-props','industry2','housing-levels'],motion:['disasters','citizens-actions','caravan','machine-layers','pets']};
labels.additions=additions.atlases.map(a=>a.name);labels.accessories=accessories.atlases.map(a=>a.name);labels.readiness=readiness.atlases.map(a=>a.name);labels.motion.push(...readiness.atlases.filter(a=>a.sequences).map(a=>a.name));labels.audio=[];labels.motion.push('duel-actions','new-crop-stages');
for(const [filter,text] of [['additions','首批补充 · 80 帧'],['accessories','配件补齐 · 44 帧'],['readiness',`本轮补齐 · ${readiness.activeFrames} 帧/纹理`],['audio','环境音试听']]){const button=document.createElement('button');button.dataset.filter=filter;button.setAttribute('aria-pressed','false');button.textContent=text;document.querySelector('nav').append(button);}
document.querySelector('#stats').innerHTML=`<span><b>${manifest.atlases.length}</b>图集</span><span><b>${manifest.activeFrames}</b>有效画格</span><span><b>${(manifest.webpBytes/1e6).toFixed(2)}</b>MB 位图</span><span>透明位图 / 原生 SVG</span>`;
let moving=false;const previews=[];
// Decoding is deferred by the browser in a hidden tab, so it must never gate the
// gallery. Build the cards first, and let each image finish on its own with a
// timeout so a suspended decode cannot stall the page.
const whenDecoded=(img,src)=>{const loaded=new Promise(resolve=>{if(img.complete&&img.naturalWidth)return resolve();img.addEventListener('load',()=>resolve(),{once:true});img.addEventListener('error',()=>resolve(),{once:true});setTimeout(resolve,8000);});img.src=src;return loaded.then(()=>Promise.race([img.decode().catch(()=>{}),new Promise(r=>setTimeout(r,3000))]));};
for(const atlas of manifest.atlases){const card=document.createElement('article');card.dataset.name=atlas.name;card.innerHTML=`<header><div><h2>${atlas.label}</h2><small>${atlas.width} × ${atlas.height} · ${atlas.activeFrames} 画格 · ${Number.isFinite(atlas.assetBytes??atlas.webpBytes)?((atlas.assetBytes??atlas.webpBytes)/1024).toFixed(0)+' KB':'大小未登记'}</small></div><button aria-pressed="false">查看切片</button></header><div class="stage"><img alt="${atlas.label}完整图集" src="${atlas.image}" loading="lazy"></div><div class="note">${atlas.name} · 透明像素 ${atlas.alphaPercent??'未登记'}${Number.isFinite(atlas.alphaPercent)?'%':''}${atlas.name==='housing-levels'||atlas.name==='machine-layers'?' · 4 × 2 排列，末尾两格备用':''}</div>`;
 document.querySelector('#gallery').append(card);if(atlas.tileable){const field=document.createElement('div');field.style.cssText=`height:260px;background-image:url(${atlas.image});background-size:128px 128px;background-repeat:repeat;background-color:#315548`;field.setAttribute('aria-label',atlas.label+' 4×2 平铺验证');card.append(field);}
 const image=new Image();let ready;const ensureImage=()=>ready??=whenDecoded(image,atlas.image);const stage=card.querySelector('.stage');let split=false;
 const frames=Object.entries(atlas.frames);const draw=(canvas,frame,withPivot=false)=>{const ctx=canvas.getContext('2d');canvas.width=192;canvas.height=160;ctx.clearRect(0,0,192,160);const scale=Math.min(180/(atlas.sequences?Math.max(...frames.map(([,f])=>f.w)):frame.w),145/(atlas.sequences?Math.max(...frames.map(([,f])=>f.h)):frame.h)),w=frame.w*scale,h=frame.h*scale,x=atlas.sequences?96-frame.pivot[0]*scale:(192-w)/2,y=atlas.sequences?150-frame.pivot[1]*scale:(160-h)/2;ctx.drawImage(image,frame.x,frame.y,frame.w,frame.h,x,y,w,h);if(withPivot){const px=x+frame.pivot[0]*scale,py=y+frame.pivot[1]*scale;ctx.strokeStyle='#f0b852';ctx.beginPath();ctx.moveTo(px-5,py);ctx.lineTo(px+5,py);ctx.moveTo(px,py-5);ctx.lineTo(px,py+5);ctx.stroke();}};
 card.querySelector('button').onclick=async e=>{const button=e.currentTarget;await ensureImage();if(!image.naturalWidth)return;split=!split;button.setAttribute('aria-pressed',String(split));button.textContent=split?'查看整图':'查看切片';stage.replaceChildren();if(!split){const img=image.cloneNode();img.alt=atlas.label+'完整图集';stage.append(img);return;}const grid=document.createElement('div');grid.className='frames';for(let i=0;i<frames.length;i++){const [id,frame]=frames[i],tile=document.createElement('div');tile.className='tile';const canvas=document.createElement('canvas'),caption=document.createElement('span');canvas.setAttribute('aria-label',id);caption.textContent=id;tile.append(canvas,caption);grid.append(tile);draw(canvas,frame,atlas.name==='machine-layers');if(atlas.sequences){const sequence=Object.values(atlas.sequences).find(seq=>seq.frames[0]===id);if(sequence)previews.push({card,canvas,frames:sequence.frames.map(key=>atlas.frames[key]),draw,frameRate:sequence.frameRate});}else if(labels.motion.includes(atlas.name)&&atlas.name!=='machine-layers'&&i%2===0)previews.push({card,canvas,frames:[frame,frames[i+1]?.[1]??frame],draw,frameRate:2});}stage.append(grid);};
}
const audioCatalog=await fetch('/assets/expansion-2026-09/audio/manifest.json').then(r=>{if(!r.ok)throw Error('环境音目录加载失败');return r.json()});
const audioCompletion=await fetch('/assets/accessories-2026-09/audio/manifest.json').then(r=>{if(!r.ok)throw Error('建筑环境音目录加载失败');return r.json()});
audioCatalog.tracks.push(...audioCompletion.tracks);
for(const track of audioCatalog.tracks){const card=document.createElement('article');card.dataset.name='audio-'+track.name;labels.audio.push(card.dataset.name);const heading=document.createElement('header'),title=document.createElement('h2'),body=document.createElement('div'),audio=document.createElement('audio'),note=document.createElement('p');title.textContent=track.label;heading.append(title);body.className='stage';audio.controls=true;audio.loop=true;audio.preload='none';audio.src=track.url;audio.setAttribute('aria-label',track.label);audio.style.maxWidth='100%';note.className='note';note.textContent='8 秒循环 · 程序合成 · 尚未接入游戏';body.append(audio);card.append(heading,body,note);document.querySelector('#gallery').append(card);audio.addEventListener('play',()=>{document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause();});});}
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{const filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('article').forEach(card=>{card.hidden=filter!=='all'&&!labels[filter].includes(card.dataset.name);if(card.hidden)card.querySelector('audio')?.pause();});});
document.querySelector('#motion').onclick=e=>{moving=!moving;e.currentTarget.setAttribute('aria-pressed',String(moving));e.currentTarget.textContent=moving?'暂停动作示意':'播放动作示意';if(moving)document.querySelectorAll('article').forEach(card=>{if(labels.motion.includes(card.dataset.name)&&card.querySelector('button').getAttribute('aria-pressed')==='false')card.querySelector('button').click();});};
setInterval(()=>{if(!moving||document.hidden)return;for(let i=previews.length-1;i>=0;i--){const p=previews[i];if(!p.canvas.isConnected){previews.splice(i,1);continue;}if(!p.card.hidden)p.draw(p.canvas,p.frames[Math.floor(performance.now()*p.frameRate/1000)%p.frames.length]);}},250);
</script></html>
